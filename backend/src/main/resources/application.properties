spring.application.name=sangabriel

# Conexion local (sin contrasenas dentro del repositorio)
spring.datasource.url=jdbc:mysql://127.0.0.1:${DB_PORT:3307}/${DB_NAME:clinica_san_gabriel}?useSSL=false&serverTimezone=UTC
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate/JPA (solo en entorno de desarrollo)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

server.port=${SERVER_PORT:8080}

# Clave de firma JWT, requerida en la variable de entorno JWT_SECRET
jwt.secret=${JWT_SECRET:}

# Datos DEMO: deshabilitados por defecto
# No se ejecuta el inicializador salvo que DEMO_SEED_ENABLED=true
demo.seed.enabled=${DEMO_SEED_ENABLED:false}
demo.seed.username=${DEMO_SEED_USERNAME:}
demo.seed.password=${DEMO_SEED_PASSWORD:}

# Muestra el motivo del error en las respuestas (util para Postman)
server.error.include-message=always
